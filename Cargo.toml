[package]
name = "lanhu_asset_exporter"
version = "0.1.0"
edition = "2024"
description = "A Ratatui exporter for Lanhu Sketch JSON and development assets"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
url = "2"
